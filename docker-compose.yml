services:
  subhub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内构建加速：在 .env 中设置 PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
    image: subhub:latest
    container_name: subhub
    restart: unless-stopped
    ports:
      - "8900:8000"
    volumes:
      # 数据库与运行数据持久化（含真实订阅信息，请勿提交仓库）
      - ./backend/data:/app/backend/data
    environment:
      TZ: Asia/Shanghai
      # 抓取订阅走代理时设置，如 http://127.0.0.1:7890
      SUBHUB_PROXY: "${SUBHUB_PROXY:-}"
    depends_on:
      - mihomo

  # 可选 HTTPS 反代：docker compose --profile https up -d（自签证书，9443 端口）
  caddy:
    image: caddy:2-alpine
    container_name: subhub-caddy
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "9443:443"
    environment:
      # 访问用的 IP/域名，在 .env 中设置（默认 192.168.31.137）
      SITE_HOST: "${SITE_HOST:-192.168.31.137}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - subhub

  # 专用于真实延迟测速的 mihomo 实例（不对外提供代理）
  mihomo:
    build:
      context: ./deploy/mihomo
      args:
        MIHOMO_VERSION: v1.19.32
    image: subhub-mihomo:latest
    container_name: subhub-mihomo
    restart: unless-stopped
    volumes:
      - ./deploy/mihomo/config.yaml:/root/.config/mihomo/config.yaml:ro
    command: ["/usr/local/bin/mihomo", "-d", "/root/.config/mihomo"]

volumes:
  caddy-data:
